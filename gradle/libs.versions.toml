[versions]
agp = "9.5.1"
kotlin = "2.4.21"
composeBom = "2026.09.00"
coreKtx = "1.19.1"
activityCompose = "1.13.0"
coroutines = "1.11.0"
junit = "4.13.2"
materialIcons = "1.7.8"
jmh = "1.37"
jmhPlugin = "0.7.4"
benchmark = "1.5.0"
profileinstaller = "1.4.1"
uiautomator = "2.3.0"
androidxTestExtJunit = "1.3.0"
androidxTestRunner = "1.7.0"
autofill = "1.1.0"
libphonenumber = "9.0.38"
bytedecoTesseract = "5.5.0-1.5.11"
bytedecoLeptonica = "1.85.0-1.5.11"
bytedecoJavacpp = "1.5.11"

[libraries]
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "coreKtx" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activityCompose" }
compose-bom = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }
compose-ui = { module = "androidx.compose.ui:ui" }
compose-material3 = { module = "androidx.compose.material3:material3" }
compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
compose-material-icons-extended = { module = "androidx.compose.material:material-icons-extended", version.ref = "materialIcons" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
junit = { module = "junit:junit", version.ref = "junit" }
androidx-profileinstaller = { module = "androidx.profileinstaller:profileinstaller", version.ref = "profileinstaller" }
androidx-benchmark-macro-junit4 = { module = "androidx.benchmark:benchmark-macro-junit4", version.ref = "benchmark" }
androidx-uiautomator = { module = "androidx.test.uiautomator:uiautomator", version.ref = "uiautomator" }
androidx-test-ext-junit = { module = "androidx.test.ext:junit", version.ref = "androidxTestExtJunit" }
androidx-test-runner = { module = "androidx.test:runner", version.ref = "androidxTestRunner" }
androidx-autofill = { module = "androidx.autofill:autofill", version.ref = "autofill" }
libphonenumber = { module = "com.googlecode.libphonenumber:libphonenumber", version.ref = "libphonenumber" }
bytedeco-tesseract = { module = "org.bytedeco:tesseract", version.ref = "bytedecoTesseract" }
bytedeco-leptonica = { module = "org.bytedeco:leptonica", version.ref = "bytedecoLeptonica" }
bytedeco-javacpp = { module = "org.bytedeco:javacpp", version.ref = "bytedecoJavacpp" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-test = { id = "com.android.test", version.ref = "agp" }
baselineprofile = { id = "androidx.baselineprofile", version.ref = "benchmark" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
jmh = { id = "me.champeau.jmh", version.ref = "jmhPlugin" }
